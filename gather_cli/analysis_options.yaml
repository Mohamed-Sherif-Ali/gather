# Static analysis for gather_cli.
# Check with: dart analyze
# Docs: https://dart.dev/tools/analysis · every lint: https://dart.dev/lints

# Base: the Dart team's "recommended" set (includes the "core" set).
include: package:lints/recommended.yaml

analyzer:
  language:
    # No silent casts from `dynamic`. jsonDecode returns dynamic, so you
    # must check or cast its values yourself (Day 2 and Day 4).
    strict-casts: true
    # Report it when the analyzer can't infer a type and would fall back to `dynamic`.
    strict-inference: true
    # No raw generics: write `List<Event>`, never just `List`.
    strict-raw-types: true

linter:
  rules:
    # Async (Day 3)
    - unawaited_futures       # a Future you forgot to await
    - cancel_subscriptions    # a StreamSubscription you never cancel
    - close_sinks             # a StreamController you never close

    # Immutability and const
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals

    # Types and safety
    - always_declare_return_types
    - avoid_dynamic_calls     # calling methods on `dynamic` (common with JSON)
    - only_throw_errors       # throw Exception/Error subclasses, not strings

    # Style
    - prefer_single_quotes
    - directives_ordering     # sorted imports: dart:, then package:, then relative

    # Note: `avoid_print` is left off on purpose. This is a command-line app,
    # so printing to the terminal is its job. It gets turned on for the
    # Flutter app on Day 7.
